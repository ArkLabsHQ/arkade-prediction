# Single-instance deployment: one app container (UI/API + single-writer workflows) and one attestor.
# Every variable is passed explicitly: Dokploy's environment UI only reaches services that reference it.
name: arkade-prediction

x-image: &image
  image: ${APM_IMAGE:-arkade-prediction:local}
  build: .

services:
  app:
    <<: *image
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    # Reached through the platform's proxy (Dokploy domain -> app:37400); compose.regtest.yaml publishes it locally.
    # 37401 is the unauthenticated operator API/console: route it only through an access-controlled edge.
    expose:
      - "37400"
      - "37401"
    volumes:
      - apm-data:/data
    environment:
      APM_NETWORK: ${APM_NETWORK:?set APM_NETWORK}
      APM_DEPLOYMENT_ID: ${APM_DEPLOYMENT_ID:-}
      HOST: 0.0.0.0
      PORT: "37400"
      DATA_DIR: /data
      ARK_SERVER_URL: ${ARK_SERVER_URL:-}
      EMULATOR_URL: ${EMULATOR_URL:-}
      ESPLORA_URL: ${ESPLORA_URL:-}
      PUBLIC_ARK_SERVER_URL: ${PUBLIC_ARK_SERVER_URL:-}
      PUBLIC_EMULATOR_URL: ${PUBLIC_EMULATOR_URL:-}
      PUBLIC_ESPLORA_URL: ${PUBLIC_ESPLORA_URL:-}
      EXPLORER_URL: ${EXPLORER_URL:-}
      ARK_SIGNER_PUBKEY: ${ARK_SIGNER_PUBKEY:-}
      EMULATOR_PUBKEY: ${EMULATOR_PUBKEY:-}
      OPERATOR_MNEMONIC: ${OPERATOR_MNEMONIC:-}
      OPERATOR_MNEMONIC_FILE: ${OPERATOR_MNEMONIC_FILE:-}
      LP_MNEMONIC: ${LP_MNEMONIC:-}
      LP_MNEMONIC_FILE: ${LP_MNEMONIC_FILE:-}
      ORACLE_SECRET_KEY: ${APP_ORACLE_SECRET_KEY:-}
      DEV_ORACLE_SECRET: ${DEV_ORACLE_SECRET:-}
      ORACLE_URL: ${ORACLE_URL:-http://oracle:37410}
      ORACLE_URLS: ${ORACLE_URLS:-}
      ORACLE_PUBKEYS: ${ORACLE_PUBKEYS:-}
      ORACLE_THRESHOLD: ${ORACLE_THRESHOLD:-1}
      ORACLE_EPOCH: ${ORACLE_EPOCH:-1}
      POLYMARKET_ENABLED: ${POLYMARKET_ENABLED:-false}
      POLYMARKET_GAMMA_URL: ${POLYMARKET_GAMMA_URL:-https://gamma-api.polymarket.com}
      POLYGON_RPC_URLS: ${POLYGON_RPC_URLS:-}
      ZK_TRACKING_ENABLED: ${ZK_TRACKING_ENABLED:-false}
      POLYGON_ARCHIVE_RPC_URLS: ${POLYGON_ARCHIVE_RPC_URLS:-}
      ETHEREUM_RPC_URLS: ${ETHEREUM_RPC_URLS:-}
      POLYMARKET_RESOLVERS: ${POLYMARKET_RESOLVERS:-}
      POLYMARKET_CREATORS: ${POLYMARKET_CREATORS:-}
      POLYMARKET_NEGRISK_ORACLES: ${POLYMARKET_NEGRISK_ORACLES:-}
      KALSHI_ENABLED: ${KALSHI_ENABLED:-false}
      KALSHI_API_URL: ${KALSHI_API_URL:-https://api.elections.kalshi.com/trade-api/v2}
      MANIFOLD_ENABLED: ${MANIFOLD_ENABLED:-false}
      MANIFOLD_API_URL: ${MANIFOLD_API_URL:-https://api.manifold.markets/v0}
      LIMITLESS_ENABLED: ${LIMITLESS_ENABLED:-false}
      LIMITLESS_API_URL: ${LIMITLESS_API_URL:-https://api.limitless.exchange}
      LIMITLESS_RESOLVERS: ${LIMITLESS_RESOLVERS:-}
      BASE_RPC_URLS: ${BASE_RPC_URLS:-https://base.gateway.tenderly.co,https://base-mainnet.public.blastapi.io,https://mainnet.base.org}
      OPINION_ENABLED: ${OPINION_ENABLED:-false}
      OPINION_API_URL: ${OPINION_API_URL:-https://openapi.opinion.trade/openapi}
      OPINION_ORACLES: ${OPINION_ORACLES:-}
      BNB_RPC_URLS: ${BNB_RPC_URLS:-https://bsc-rpc.publicnode.com,https://bsc.blockrazor.xyz}
      UPDOWN_ENABLED: ${UPDOWN_ENABLED:-false}
      UPDOWN_SETTLEMENT: ${UPDOWN_SETTLEMENT:-redstone}
      UPDOWN_MAX_ACTIVE: ${UPDOWN_MAX_ACTIVE:-4}
      UPDOWN_WINDOWS: ${UPDOWN_WINDOWS:-15m,4h}
      UPDOWN_ASSETS: ${UPDOWN_ASSETS:-BTC,ETH,SOL,XRP,DOGE,BNB}
      UPDOWN_LEAD_SECONDS: ${UPDOWN_LEAD_SECONDS:-7200}
      UPDOWN_TIMEOUT_SECONDS: ${UPDOWN_TIMEOUT_SECONDS:-3600}
      IMPORT_TAGS: ${IMPORT_TAGS:-}
      IMPORT_MAX_ACTIVE: ${IMPORT_MAX_ACTIVE:-5}
      IMPORT_MAX_PER_SECTION: ${IMPORT_MAX_PER_SECTION:-0}
      IMPORT_MIN_HORIZON_SECONDS: ${IMPORT_MIN_HORIZON_SECONDS:-3600}
      IMPORT_MAX_HORIZON_SECONDS: ${IMPORT_MAX_HORIZON_SECONDS:-2592000}
      IMPORT_INTERVAL_SECONDS: ${IMPORT_INTERVAL_SECONDS:-600}
      IMPORT_PAGE_LIMIT: ${IMPORT_PAGE_LIMIT:-100}
      IMPORT_MAX_PAGES: ${IMPORT_MAX_PAGES:-5}
      IMPORT_TIMEOUT_DAYS: ${IMPORT_TIMEOUT_DAYS:-60}
      RESOLUTION_INTERVAL_SECONDS: ${RESOLUTION_INTERVAL_SECONDS:-120}
      MARKET_UNIT_SATS: ${MARKET_UNIT_SATS:-1000}
      MARKET_BASE_SATS: ${MARKET_BASE_SATS:-1000}
      MARKET_CAP_SETS: ${MARKET_CAP_SETS:-1000}
      KEEPER_INTERVAL_SECONDS: ${KEEPER_INTERVAL_SECONDS:-15}
      RENEW_THRESHOLD_SECONDS: ${RENEW_THRESHOLD_SECONDS:-3600}
      LP_BOOTSTRAP_SETS: ${LP_BOOTSTRAP_SETS:-0}
      LP_ASK_YES_SATS: ${LP_ASK_YES_SATS:-0}
      LP_ASK_NO_SATS: ${LP_ASK_NO_SATS:-0}
      LP_BUSY_ONLY: ${LP_BUSY_ONLY:-true}
      LP_BID_SETS: ${LP_BID_SETS:-0}
      LP_SKEW_BPS: ${LP_SKEW_BPS:-100}
      LP_MAX_SETS_PER_MARKET: ${LP_MAX_SETS_PER_MARKET:-0}
      DEV_ENDPOINTS: ${DEV_ENDPOINTS:-false}
      WORKERS: ${WORKERS:-all}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  oracle:
    <<: *image
    command: ["node", "dist/oracle/main.js"]
    init: true
    restart: unless-stopped
    volumes:
      - apm-oracle:/data
    environment:
      ORACLE_SECRET_KEY: ${ORACLE_SECRET_KEY:-}
      ORACLE_SECRET_KEY_FILE: ${ORACLE_SECRET_KEY_FILE:-}
      ORACLE_PORT: "37410"
      ORACLE_DATA_DIR: /data/oracle
      ORACLE_EPOCH: ${ORACLE_EPOCH:-1}
      APM_NETWORK: ${APM_NETWORK:?set APM_NETWORK}
      ARK_SERVER_URL: ${ARK_SERVER_URL:-}
      ARK_SIGNER_XONLY: ${ARK_SIGNER_XONLY:-}
      EMULATOR_PUBKEY: ${EMULATOR_PUBKEY:-}
      POLYMARKET_GAMMA_URL: ${POLYMARKET_GAMMA_URL:-https://gamma-api.polymarket.com}
      POLYGON_RPC_URLS: ${POLYGON_RPC_URLS:-}
      POLYMARKET_RESOLVERS: ${POLYMARKET_RESOLVERS:-}
      POLYMARKET_CREATORS: ${POLYMARKET_CREATORS:-}
      POLYMARKET_NEGRISK_ORACLES: ${POLYMARKET_NEGRISK_ORACLES:-}
      KALSHI_ENABLED: ${KALSHI_ENABLED:-false}
      KALSHI_API_URL: ${KALSHI_API_URL:-https://api.elections.kalshi.com/trade-api/v2}
      MANIFOLD_ENABLED: ${MANIFOLD_ENABLED:-false}
      MANIFOLD_API_URL: ${MANIFOLD_API_URL:-https://api.manifold.markets/v0}
      LIMITLESS_ENABLED: ${LIMITLESS_ENABLED:-false}
      LIMITLESS_API_URL: ${LIMITLESS_API_URL:-https://api.limitless.exchange}
      LIMITLESS_RESOLVERS: ${LIMITLESS_RESOLVERS:-}
      BASE_RPC_URLS: ${BASE_RPC_URLS:-https://base.gateway.tenderly.co,https://base-mainnet.public.blastapi.io,https://mainnet.base.org}
      OPINION_ENABLED: ${OPINION_ENABLED:-false}
      OPINION_API_URL: ${OPINION_API_URL:-https://openapi.opinion.trade/openapi}
      OPINION_ORACLES: ${OPINION_ORACLES:-}
      BNB_RPC_URLS: ${BNB_RPC_URLS:-https://bsc-rpc.publicnode.com,https://bsc.blockrazor.xyz}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:37410/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  apm-data:
  apm-oracle:
